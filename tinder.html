<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スワイプアプリ（ブロック機能付き）</title>
    <!-- Tailwind CSS (スタイリング用) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome (アイコン用) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* スワイプ操作時の画面揺れや意図しないスクロールを防ぐ設定 */
        body {
            overscroll-behavior-y: none;
            touch-action: none;
            overflow: hidden;
        }

        /* カードの基本設定とアニメーション */
        .tinder-card {
            transition: transform 0.3s ease-out, opacity 0.3s ease-out;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            user-select: none;
            -webkit-user-select: none;
        }

        /* ドラッグ中のカードはアニメーションをオフにして指に追従させる */
        .tinder-card.dragging {
            transition: none;
            cursor: grabbing !important;
        }

        /* 処理済みのカードは操作不可にする */
        .tinder-card.removed {
            pointer-events: none;
        }

        /* ボタンを押したときのアクション */
        .action-button {
            transition: transform 0.1s ease, background-color 0.2s ease;
        }
        .action-button:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body class="bg-gray-100 h-screen w-screen flex flex-col items-center justify-between py-6">

    <!-- ヘッダー -->
    <div class="w-full max-w-sm px-4 flex justify-between items-center z-10">
        <i class="fas fa-user text-gray-400 text-2xl"></i>
        <i class="fas fa-fire text-pink-500 text-3xl"></i>
        <i class="fas fa-comments text-gray-400 text-2xl"></i>
    </div>

    <!-- メインコンテナ（カード表示領域） -->
    <div class="relative w-full max-w-sm flex-grow my-4 px-2">
        
        <!-- カードスタック領域 -->
        <div id="card-stack" class="relative w-full h-full perspective-1000">
            
            <!-- 全員スワイプし終わった後のメッセージ -->
            <div id="end-message" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 opacity-0 transition-opacity duration-500 z-0 pointer-events-none">
                <i class="fas fa-satellite-dish text-5xl mb-4 text-gray-300"></i>
                <p class="text-xl font-bold">周りに人がいません</p>
                <p class="text-sm mt-2">条件を変更してみてください</p>
                <button onclick="location.reload()" class="mt-8 px-8 py-3 bg-gradient-to-r from-pink-500 to-orange-400 text-white rounded-full font-bold shadow-lg hover:shadow-xl transition pointer-events-auto">
                    もう一度探す
                </button>
            </div>
            
            <!-- ※JavaScriptによってここにカードが生成されます -->
        </div>

    </div>

    <!-- コントロールボタン群 -->
    <div class="flex justify-center items-center gap-4 h-24 mb-2 z-10 w-full max-w-sm px-4">
        <!-- Nope (左) ボタン -->
        <button id="btn-nope" class="action-button w-16 h-16 bg-white rounded-full shadow-lg flex items-center justify-center text-red-500 text-3xl hover:bg-red-50">
            <i class="fas fa-times"></i>
        </button>
        
        <!-- Block (下) ボタン -->
        <button id="btn-block" class="action-button w-14 h-14 bg-white rounded-full shadow-md flex items-center justify-center text-gray-500 text-xl hover:bg-gray-50 border-2 border-gray-100">
            <i class="fas fa-ban"></i>
        </button>

        <!-- Like (右) ボタン -->
        <button id="btn-like" class="action-button w-16 h-16 bg-white rounded-full shadow-lg flex items-center justify-center text-green-500 text-3xl hover:bg-green-50">
            <i class="fas fa-heart"></i>
        </button>
    </div>


    <script>
        /* ========================================================
           ■ カスタマイズ領域：プロフィールデータ
           ======================================================== 
           ご自身で変更する場合は、この配列の中身を編集してください。
           image: の後ろのURL（""の中）を好きな画像のURLに変更できます。
        */
        const profiles = [
            {
                name: "ぞうさん",
                age: 20,
                job: "動物園勤務",
                bio: "ご飯たくさん食べて力持ちです。よろしくお願いします！",
                image: "images/zou.png"
            },
            {
                name: "デブスのヌオー",
                age: 36,
                job: "ポケモン",
                bio: "のんびりとした 性格で 気ままに 泳いでは いつも 船底に 頭を ぶつけてます。",
                image: "images/nuo.jpg"
            },
            {
                name: "ブースカ",
                age: 36,
                job: "怪獣",
                bio: "前歯がチャームポイント！争いを好まず心優しいのんびり屋で、おちゃめな食いしん坊です。",
                image: "images/gu.jpg"
            },
            {
                name: "岡田俊哉",
                age: 34,
                job: "元プロ野球選手",
                bio: "元中日ドラゴンズ投手。左打左投。2017年WBC出場してます！",
                image: "images/oka.jpg"
            },
            {
                name: "あーがま",
                age: 36,
                job: "オタク",
                bio: "スイミイ結婚しよう",
                image: "images/gama.jpg"
            }
        ];
        /* ======================================================== */


        const stack = document.getElementById('card-stack');
        const endMessage = document.getElementById('end-message');
        
        let isDragging = false;
        let startX = 0, startY = 0;
        let deltaX = 0, deltaY = 0;
        let activeCard = null;

        // 初期化処理：カードを生成してスタックに追加
        function initCards() {
            profiles.forEach((profile, index) => {
                const card = document.createElement('div');
                card.className = `tinder-card absolute inset-0 bg-white rounded-3xl overflow-hidden flex flex-col`;
                // z-indexを設定して先頭のデータが一番上になるようにする
                card.style.zIndex = profiles.length - index;
                
                // LIKE, NOPE, BLOCKのスタンプHTML
                const stamps = `
                    <div class="stamp stamp-like absolute top-10 left-6 border-4 border-green-500 text-green-500 font-bold text-5xl tracking-widest rounded-lg px-3 py-1 transform -rotate-12 opacity-0 z-20 pointer-events-none transition-opacity duration-100 bg-white/20 backdrop-blur-sm">LIKE</div>
                    <div class="stamp stamp-nope absolute top-10 right-6 border-4 border-red-500 text-red-500 font-bold text-5xl tracking-widest rounded-lg px-3 py-1 transform rotate-12 opacity-0 z-20 pointer-events-none transition-opacity duration-100 bg-white/20 backdrop-blur-sm">NOPE</div>
                    <div class="stamp stamp-block absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 border-4 border-gray-700 text-gray-700 font-bold text-5xl tracking-widest rounded-lg px-4 py-2 opacity-0 z-20 pointer-events-none transition-opacity duration-100 bg-white/80 backdrop-blur-sm shadow-xl">BLOCK</div>
                `;

                // 画像とプロフィールのHTML
                const content = `
                    <div class="relative w-full h-[75%] bg-gray-200">
                        <img src="${profile.image}" alt="${profile.name}" class="w-full h-full object-cover pointer-events-none" draggable="false">
                        <!-- 画像下部のグラデーション（テキストを読みやすくするため） -->
                        <div class="absolute inset-x-0 bottom-0 h-1/2 bg-gradient-to-t from-black/80 to-transparent pointer-events-none"></div>
                        
                        <!-- 名前、年齢、職業 -->
                        <div class="absolute bottom-4 left-4 text-white pointer-events-none pr-4">
                            <h2 class="text-3xl font-bold flex items-end gap-2">
                                ${profile.name} <span class="text-2xl font-normal">${profile.age}</span>
                            </h2>
                            <p class="text-sm mt-1 opacity-90"><i class="fas fa-briefcase mr-2"></i>${profile.job}</p>
                        </div>
                    </div>
                    
                    <!-- 自己紹介文 -->
                    <div class="w-full h-[25%] bg-white p-5 text-gray-700 pointer-events-none flex flex-col justify-start">
                        <p class="text-sm leading-relaxed line-clamp-3">${profile.bio}</p>
                    </div>
                `;

                card.innerHTML = stamps + content;
                stack.appendChild(card);
            });

            updateCardsStyle();
        }

        // カードの重なり具合（奥行き）を計算してスタイルを適用する
        function updateCardsStyle() {
            // removedクラスが付いていない（まだスワイプされていない）カードを取得
            const cards = Array.from(stack.querySelectorAll('.tinder-card:not(.removed)'));
            
            if (cards.length === 0) {
                // カードがなくなったら終了メッセージを表示
                endMessage.style.opacity = 1;
                endMessage.style.zIndex = 10;
                return;
            }

            cards.forEach((card, index) => {
                if (index === 0) {
                    // 一番上のカード：定位置、操作可能
                    card.style.transform = `translate(0px, 0px) scale(1)`;
                    card.style.opacity = 1;
                    setupDragEvents(card);
                } else {
                    // 2枚目以降のカード：少し下にずらして縮小し、奥行きを出す
                    const offset = index * 12; // 下にずらす量
                    const scale = 1 - (index * 0.04); // 縮小する量
                    card.style.transform = `translateY(${offset}px) scale(${scale})`;
                    
                    // 4枚目以降は見えないようにする
                    card.style.opacity = index > 2 ? 0 : 1; 
                    
                    // 下のカードはイベントを無効化
                    card.onmousedown = null;
                    card.ontouchstart = null;
                }
            });
        }


        /* ========================================================
           ■ スワイプ（ドラッグ）操作の制御ロジック
           ======================================================== */
        
        function setupDragEvents(card) {
            // パソコンのマウス操作と、スマホのタッチ操作の両方に対応
            card.onmousedown = handleDragStart;
            card.ontouchstart = handleDragStart;
        }

        function handleDragStart(e) {
            e.preventDefault();
            isDragging = true;
            activeCard = this;
            activeCard.classList.add('dragging'); // アニメーションをオフにするクラス
            
            // タッチとマウスで座標の取得方法を変える
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            
            startX = clientX;
            startY = clientY;
            deltaX = 0;
            deltaY = 0;

            document.addEventListener('mousemove', handleDragMove);
            document.addEventListener('touchmove', handleDragMove, {passive: false});
            document.addEventListener('mouseup', handleDragEnd);
            document.addEventListener('touchend', handleDragEnd);
        }

        function handleDragMove(e) {
            if (!isDragging || !activeCard) return;
            e.preventDefault(); // スクロールなどブラウザのデフォルト挙動を防止

            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

            deltaX = clientX - startX;
            deltaY = clientY - startY;

            // X軸の移動量に応じてカードを少し回転させる
            const rotate = deltaX * 0.05;
            activeCard.style.transform = `translate(${deltaX}px, ${deltaY}px) rotate(${rotate}deg)`;

            // スタンプの表示制御
            const stampLike = activeCard.querySelector('.stamp-like');
            const stampNope = activeCard.querySelector('.stamp-nope');
            const stampBlock = activeCard.querySelector('.stamp-block');

            // ★ 下方向への強い動き（Block）の判定
            // Y軸（下）への移動が50px以上 かつ X軸の移動量より大きい場合
            const isBlockIntent = deltaY > 50 && deltaY > Math.abs(deltaX);

            if (isBlockIntent) {
                // 下スワイプ：BLOCKスタンプを濃くしていく
                stampBlock.style.opacity = Math.min(1, (deltaY - 50) / 100);
                stampLike.style.opacity = 0;
                stampNope.style.opacity = 0;
            } else {
                stampBlock.style.opacity = 0;
                if (deltaX > 0) {
                    // 右スワイプ：LIKEスタンプ
                    stampLike.style.opacity = Math.min(1, deltaX / 100);
                    stampNope.style.opacity = 0;
                } else {
                    // 左スワイプ：NOPEスタンプ
                    stampLike.style.opacity = 0;
                    stampNope.style.opacity = Math.min(1, Math.abs(deltaX) / 100);
                }
            }
        }

        function handleDragEnd() {
            if (!isDragging || !activeCard) return;
            isDragging = false;
            activeCard.classList.remove('dragging');

            // イベントリスナーを解除
            document.removeEventListener('mousemove', handleDragMove);
            document.removeEventListener('touchmove', handleDragMove);
            document.removeEventListener('mouseup', handleDragEnd);
            document.removeEventListener('touchend', handleDragEnd);

            // スワイプを確定させる「しきい値」
            const thresholdX = window.innerWidth * 0.25; // 画面幅の25%以上横に動かしたら確定
            const thresholdY = 120; // 120px以上下に動かしたらブロック確定

            const isBlockIntent = deltaY > thresholdY && deltaY > Math.abs(deltaX);

            if (isBlockIntent) {
                performSwipe('block', activeCard);
            } else if (deltaX > thresholdX) {
                performSwipe('like', activeCard);
            } else if (deltaX < -thresholdX) {
                performSwipe('nope', activeCard);
            } else {
                // しきい値を超えなかった場合は元の位置に戻す
                activeCard.style.transform = `translate(0px, 0px) rotate(0deg)`;
                // スタンプを消す
                activeCard.querySelectorAll('.stamp').forEach(s => s.style.opacity = 0);
            }
            
            activeCard = null;
        }

        /* ========================================================
           ■ スワイプ確定時のアニメーションと次カードの準備
           ======================================================== */
        function performSwipe(direction, card = null) {
            // ボタンから呼び出された場合は、現在一番上のカードを取得
            if (!card) {
                const cards = Array.from(stack.querySelectorAll('.tinder-card:not(.removed)'));
                if (cards.length === 0) return;
                card = cards[0];
            }

            // 二重処理を防ぐためクラスを付与
            card.classList.add('removed');
            card.classList.remove('dragging');

            const throwOutDistance = window.innerWidth * 1.5; // 画面外に飛ばす距離
            let endX = 0, endY = 0, rotate = 0;

            // 方向に応じた最終的な位置と回転角を設定
            if (direction === 'like') {
                endX = throwOutDistance;
                endY = deltaY || -100; // 少し上に跳ね上げる
                rotate = 30;
                card.querySelector('.stamp-like').style.opacity = 1;
            } else if (direction === 'nope') {
                endX = -throwOutDistance;
                endY = deltaY || -100;
                rotate = -30;
                card.querySelector('.stamp-nope').style.opacity = 1;
            } else if (direction === 'block') {
                endX = deltaX || 0; // 横軸はそのまま
                endY = window.innerHeight * 1.2; // 画面の真下に落とす
                rotate = (deltaX || 0) * 0.05;
                card.querySelector('.stamp-block').style.opacity = 1;
            }

            // カードを画面外へアニメーションさせる
            card.style.transform = `translate(${endX}px, ${endY}px) rotate(${rotate}deg)`;
            card.style.opacity = 0;

            // ボタン処理用に移動量をリセット
            deltaX = 0; 
            deltaY = 0;

            // アニメーションが終わる頃(400ms後)にDOMから削除し、次のカードを準備
            setTimeout(() => {
                card.remove();
                updateCardsStyle();
            }, 400);
        }

        // ボタンのクリックイベントにスワイプ処理を割り当て
        document.getElementById('btn-nope').addEventListener('click', () => performSwipe('nope'));
        document.getElementById('btn-block').addEventListener('click', () => performSwipe('block'));
        document.getElementById('btn-like').addEventListener('click', () => performSwipe('like'));

        // アプリケーション開始
        window.onload = initCards;

    </script>
</body>
</html>
